name: Breda Fit checks and Android APK
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: fit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Generate ephemeral debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=breda_dev,C=BR" -keyalg RSA -keysize 2048 -validity 365
      - name: Shared tests, Android lint and APK
        run: ./gradlew :shared:jvmTest :androidApp:lintDebug :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest :androidApp:assemblePreview --stacktrace
      - name: Sign and verify internal test APKs
        run: |
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for apk in androidApp/build/outputs/apk/debug/*.apk androidApp/build/outputs/apk/preview/*.apk androidApp/build/outputs/apk/androidTest/debug/*.apk; do
            "$signer" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android "$apk"
            "$signer" verify --verbose "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: breda-fit-android-apk
          path: |
            androidApp/build/outputs/apk/preview/*.apk
            androidApp/build/outputs/apk/debug/*.apk
            androidApp/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: breda-fit-check-reports
          path: |
            shared/build/reports/tests/
            androidApp/build/reports/lint-results-debug.*
  ios-shared:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64

  visual-ui:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: breda-fit-android-apk
          path: ui-apks
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install $(find ui-apks -name '*debug.apk' ! -name '*androidTest*' | head -1)
            adb install $(find ui-apks -name '*androidTest.apk' | head -1)
            adb shell am instrument -w -r dev.breda.fit.debug.test/androidx.test.runner.AndroidJUnitRunner | tee ui-test-result.txt
            grep -q 'OK (4 tests)' ui-test-result.txt
            adb pull /sdcard/Android/data/dev.breda.fit.debug/files/visual-catalog.png .
            adb pull /sdcard/Android/data/dev.breda.fit.debug/files/visual-chair.png .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: breda-fit-visual-ui
          path: |
            ui-test-result.txt
            visual-catalog.png
            visual-chair.png
